<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 与主应用一致：全屏吃安全区，配色走暖纸底/暮蓝令牌 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" />
    <title>WorldChat · 离线</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 安全区留白：独立窗口里不被刘海/Home 条挡住 */
        padding: calc(32px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          calc(32px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans", "Segoe UI", sans-serif;
        background: #f6f3ee;
        color: #1c1915;
      }
      .card {
        text-align: center;
        padding: 32px 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #5c574f;
        margin: 0 0 24px;
      }
      button {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        background: #2c4a6e;
        color: #f9f7f2;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #223a57;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>当前离线</h1>
      <p>网络恢复后即可回到聊天室，已收到的消息不会丢。</p>
      <button onclick="location.href='/'">重试</button>
    </div>
  </body>
</html>
