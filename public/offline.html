<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldChat · 离线</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        background: #f5f6fa;
        color: #1f2430;
      }
      .card {
        text-align: center;
        padding: 32px 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #5a6072;
        margin: 0 0 24px;
      }
      button {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        background: #4a6cf7;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>当前离线</h1>
      <p>网络恢复后即可回到聊天室，已收到的消息不会丢。</p>
      <button onclick="location.href='/'">重试</button>
    </div>
  </body>
</html>
