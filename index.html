<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：PWA 全屏模式下内容延伸到刘海/圆角底下，配合 CSS 安全区留白 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorldChat — 和全世界的人无障碍聊天</title>
    <meta
      name="description"
      content="消息自动实时翻译，各看各的母语；每条消息都能查看原文。免费、无需注册，可安装到手机主屏像 App 一样用。"
    />

    <!-- PWA：Android/桌面通过 manifest 安装 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f3ee" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA：iOS 添加到主屏（Safari 不读 manifest 的 display/icon，要单独喂） -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WorldChat" />

    <!-- 分享到社交软件时的预览（阶段 8）；正式域名是 worldchat.chat，
         分享地址一律用它（不要再写回 workers.dev）；再换域名时记得同步 og:url/og:image/twitter:image -->
    <meta property="og:title" content="WorldChat — 和全世界的人无障碍聊天" />
    <meta
      property="og:description"
      content="消息自动实时翻译，各看各的母语；每条消息都能查看原文。免费、无需注册，可安装到手机主屏像 App 一样用。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://worldchat.chat/" />
    <meta property="og:image" content="https://worldchat.chat/icons/icon-512.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://worldchat.chat/" />
    <meta name="twitter:image" content="https://worldchat.chat/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
