# 保持免费层可用的配置，不要默认打开付费功能。
name = "world-chat"
main = "src/worker/index.ts"
compatibility_date = "2026-11-10"

# 前端静态资源（阶段 7）：Vite 构建产物和 Worker 部署到同一来源，
# 页面与 /ws WebSocket 同源，前端 wsUrl 才能直接走同源 wss。
# 请求先匹配静态文件（/、/assets/*、/manifest、/sw.js、图标…），
# 匹配不到的（/ws）落到下面的 Worker 脚本。静态资源免费、不占请求数额度。
# 注意：配置了 assets 后，本地 `npm run dev:worker` 需要先 `npm run build` 生成
# dist（日常前端开发继续用 `npm run dev` 的 vite 流程，不受影响）。
[assets]
directory = "./dist"
# ASSETS 绑定（阶段 8）：Worker 里用它把 /r/<slug>、/privacy、/terms 等
# 前端路由统一回 index.html（SPA 兜底），不影响静态资源优先匹配
binding = "ASSETS"

# Workers AI 免费额度（Free 计划每天 10,000 Neurons，无需绑卡/付费计划），
# 用于 @cf/meta/m2m100-1.2b 翻译兜底：Google 免费入口被限流时落到它。
[ai]
binding = "AI"

# 免费层要求 Durable Object 使用 SQLite 存储。
# ROOM_DIRECTORY（阶段 9）：自建房间目录，单一实例（idFromName("directory")），
# 管创建/列表/关闭校验/在房人数，不持有 WebSocket 连接。
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDurableObject" },
  { name = "ROOM_DIRECTORY", class_name = "RoomDirectoryDurableObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# 阶段 9：新增目录 DO（SQLite 存储，免费层要求）
[[migrations]]
tag = "v9_room_directory"
new_sqlite_classes = ["RoomDirectoryDurableObject"]

# 阶段 3/4 选型说明：消息与翻译缓存都放在 Durable Object 存储里，暂不引入 D1：
